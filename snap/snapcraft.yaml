name: colorpie
base: core24
version: '2.0'
summary: Color Picker and Converter
description: |
  ColorPie is a professional color management utility written in Qt.

grade: stable
confinement: strict
icon: snap/gui/icon.png

platforms:
  amd64:
  arm64:

apps:
  colorpie:
    command: usr/bin/colorpie
    extensions: [kde-neon-6]
    desktop: usr/share/applications/colorpie.desktop
    environment:
      # Chromium's own sandbox cannot start inside strict snap confinement;
      # the snap confinement itself provides the isolation.
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    plugs:
      - browser-support
      - opengl
      - wayland
      - x11

parts:
  application:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
    override-build: |
      craftctl default
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/colorpie.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/colorpie.desktop
